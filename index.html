<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Ucapan dengan 3 Ucapan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .ucapan-box {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #ucapan {
            color: white;
            font-size: 1.3em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        
        button {
            background: linear-gradient(45deg, #FE6B8B 30%, #FF8E53 90%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 3px 15px rgba(255, 105, 135, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 20px 0;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 105, 135, 0.6);
        }
        
        button:active {
            transform: translateY(-1px);
        }
        
        .counter {
            color: #666;
            font-size: 1.1em;
            margin-top: 10px;
            font-weight: bold;
        }
        
        .mode-indicator {
            display: inline-block;
            padding: 5px 15px;
            background: #4CAF50;
            color: white;
            border-radius: 20px;
            font-size: 0.9em;
            margin: 10px 0;
        }
        
        .footer {
            margin-top: 20px;
            color: #999;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨KYY-YINZA✨
        </h1>
        
        <div class="mode-indicator" id="modeIndicator">
           
        </div>
        
        <div class="ucapan-box">
            <div id="ucapan">YOH! mui disini! 👋</div>
        </div>
        
        <button onclick="gantiUcapan()">
            🔄 Ganti Ucapan
        </button>
        
        <div class="counter" id="counter">
            Tombol ditekan: 0 kali
        </div>
        
        <div class="footer">
            Klik tombol untuk melihat 3 ucapan berbeda secara bergantian
        </div>
    </div>

    <script>
        let counter = 0;
        
        function gantiUcapan() {
            counter++;
            
            // Ambil elemen ucapan
            const ucapanElement = document.getElementById('ucapan');
            const modeIndicator = document.getElementById('modeIndicator');
            
            // Ganti ucapan berdasarkan sisa pembagian 3 (0, 1, atau 2)
            if (counter % 3 === 1) {
                ucapanElement.textContent = "YOH! selamat pagi, Semoga harimu menyenangkan dan TKAmu lancar! ☀️👋";
                
                modeIndicator.style.backgroundColor = "#4CAF50"; // Hijau
            } 
            else if (counter % 3 === 2) {
                ucapanElement.textContent = "Tetap semangat dan terus berusaha walaupun hasil tidak sempurna! 🚀";
               
                modeIndicator.style.backgroundColor = "#FF9800"; // Oranye
            }
            else { // counter % 3 === 0
                ucapanElement.textContent = "terimakasih berkunjung, istirahat yg cukup, dan yah goodbay :P 🌙😴";
                
                modeIndicator.style.backgroundColor = "#2196F3"; // Biru
            }
            
            // Update counter
            document.getElementById('counter').textContent = `Tombol ditekan: ${counter} kali`;
            
            // Efek animasi sederhana
            ucapanElement.style.transform = 'scale(1.1)';
            modeIndicator.style.transform = 'scale(1.1)';
            
            setTimeout(() => {
                ucapanElement.style.transform = 'scale(1)';
                modeIndicator.style.transform = 'scale(1)';
            }, 200);
        }
    </script>
</body>
</html>
