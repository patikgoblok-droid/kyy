<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat dari TKA </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .tombol-selamat {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .tombol-selamat:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.5);
        }
        
        .tombol-selamat:active {
            transform: translateY(2px);
        }
        
        .link-surat {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 1.1em;
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 25px;
            transition: all 0.3s ease;
        }
        
        .link-surat:hover {
            background: #667eea;
            color: white;
        }
        
        .pesan {
            margin-top: 20px;
            font-size: 1.2em;
            color: #28a745;
            min-height: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Halaman selamat</h1>
        
        <button class="tombol-selamat" onclick="tampilPesan()">
            🎉 SELAMAT! 🎉
        </button>
        
        <div class="pesan" id="pesan"></div>
        
        <a href="surat.html" class="link-surat">
            📧 Baca Surat Penyemangat 📧
        </a>
    </div>

    <script>
        function tampilPesan() {
            const pesan = document.getElementById('pesan');
            const waktu = new Date().getHours();
            
            let ucapan = '';
            
            if (waktu < 12) {
                ucapan = 'Selamat Pagi! 🌅';
            } else if (waktu < 18) {
                ucapan = 'Selamat Siang! ☀️';
            } else {
                ucapan = 'Selamat Malam! 🌙';
            }
            
            pesan.innerHTML = `🎊 ${ucapan} Kamu Hebat selamat dari TKA XD! 🎊`;
            
            // Efek tambahan
            document.querySelector('.tombol-selamat').style.transform = 'scale(0.95)';
            setTimeout(() => {
                document.querySelector('.tombol-selamat').style.transform = 'scale(1)';
            }, 200);
        }
    </script>
</body>
</html>
